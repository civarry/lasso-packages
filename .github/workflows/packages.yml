# Every pull request: build lasso-pkg from Lasso's own source, validate every package with the same
# checks Lasso runs at install, check versions went up, and run each script's test. On main: publish
# index.json and the downloads in dist/. Merging is publishing.
name: Packages

on:
  pull_request:
  push:
    branches: [main]
    paths: ["packages/**", "Tools/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Lasso's source
        uses: actions/checkout@v4
        with:
          repository: civarry/lasso-app
          path: .lasso-app

      - name: Build lasso-pkg
        run: .lasso-app/Tools/lasso-pkg/build.sh "$PWD/.bin/lasso-pkg"

      - name: Validate every package
        run: .bin/lasso-pkg validate packages/* --catalog

      - name: Versions and tests
        run: Tools/check.py "$PWD/.bin/lasso-pkg" ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

      - name: Publish the index
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          .bin/lasso-pkg index packages --base-url https://raw.githubusercontent.com/civarry/lasso-packages/main --out .
          if [ -n "$(git status --porcelain index.json dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json dist
            git commit -m "Publish index.json"
            git push
          fi
